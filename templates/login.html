<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login – TestFusion Platform</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .demo-btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 20px;
            padding-top: 18px;
            border-top: 1px dashed var(--border-color);
        }
        .demo-btn {
            background-color: var(--primary-subtle);
            border: 1px solid #bae6fd;
            color: var(--primary-dark);
            padding: 8px 12px;
            border-radius: var(--radius-md);
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }
        .demo-btn:hover {
            background-color: #e0f2fe;
            border-color: #7dd3fc;
            transform: translateY(-1px);
        }
    </style>
</head>
<body style="background: none; display: block;">
    <div class="auth-wrapper">
        <div class="auth-card">
            <!-- Brand Header -->
            <div style="text-align: center; margin-bottom: 28px;">
                <div style="display: inline-flex; align-items: center; justify-content: center; width: 52px; height: 52px; border-radius: 14px; background: linear-gradient(135deg, #0284c7, #38bdf8); margin-bottom: 12px; box-shadow: 0 8px 16px rgba(2, 132, 199, 0.25);">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
                        <polyline points="2 17 12 22 22 17"></polyline>
                        <polyline points="2 12 12 17 22 12"></polyline>
                    </svg>
                </div>
                <h1 style="font-size: 1.6rem; font-weight: 800; color: #0f172a; letter-spacing: -0.5px;">Test<span style="color: #0284c7;">Fusion</span></h1>
                <p style="font-size: 0.85rem; color: #64748b; margin-top: 4px;">Integrated White Box &amp; Black Box Testing</p>
            </div>

            <!-- Flash alerts -->
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }}">
                            <span>{{ message }}</span>
                            <button onclick="this.parentElement.remove()" style="background:none; border:none; cursor:pointer; font-weight:bold; color:inherit;">&times;</button>
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <!-- Login Form -->
            <form action="{{ url_for('login') }}" method="POST" id="loginForm">
                <div class="form-group">
                    <label class="form-label" for="username">Username or Email</label>
                    <input type="text" id="username" name="username" class="form-control" placeholder="Enter your username or email" required autofocus>
                </div>

                <div class="form-group" style="margin-bottom: 20px;">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" id="password" name="password" class="form-control" placeholder="Enter your password" required>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 12px; font-size: 0.95rem;">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path><polyline points="10 17 15 12 10 7"></polyline><line x1="15" y1="12" x2="3" y2="12"></line></svg>
                    Sign In to Platform
                </button>
            </form>

            <!-- Quick Demo Login Buttons -->
            <div style="margin-top: 16px;">
                <div style="font-size: 0.72rem; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 700; text-align: center;">Instant Demo Credentials</div>
                <div class="demo-btn-group">
                    <button type="button" class="demo-btn" onclick="fillAndSubmit('tester', 'Tester@123')">
                        <span style="display:block; font-weight:700;">Demo Tester</span>
                        <span style="font-size:0.7rem; color:#64748b; font-weight:normal;">tester / Tester@123</span>
                    </button>
                    <button type="button" class="demo-btn" onclick="fillAndSubmit('admin', 'Admin@123')">
                        <span style="display:block; font-weight:700;">Demo Admin</span>
                        <span style="font-size:0.7rem; color:#64748b; font-weight:normal;">admin / Admin@123</span>
                    </button>
                </div>
            </div>

            <div style="text-align: center; margin-top: 24px; font-size: 0.85rem; color: #64748b;">
                Don't have an account yet? 
                <a href="{{ url_for('register') }}" style="color: #0284c7; text-decoration: none; font-weight: 600;">Create Account</a>
            </div>
        </div>
    </div>

    <script>
        function fillAndSubmit(user, pass) {
            document.getElementById('username').value = user;
            document.getElementById('password').value = pass;
            document.getElementById('loginForm').submit();
        }
    </script>
</body>
</html>
