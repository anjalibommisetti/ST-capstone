<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register – TestFusion Platform</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body style="background: none; display: block;">
    <div class="auth-wrapper">
        <div class="auth-card" style="max-width: 500px;">
            <!-- Brand Header -->
            <div style="text-align: center; margin-bottom: 24px;">
                <div style="display: inline-flex; align-items: center; justify-content: center; width: 48px; height: 48px; border-radius: 12px; background: linear-gradient(135deg, #0284c7, #38bdf8); margin-bottom: 10px; box-shadow: 0 8px 16px rgba(2, 132, 199, 0.25);">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
                        <polyline points="2 17 12 22 22 17"></polyline>
                        <polyline points="2 12 12 17 22 12"></polyline>
                    </svg>
                </div>
                <h1 style="font-size: 1.5rem; font-weight: 800; color: #0f172a; letter-spacing: -0.5px;">Create <span style="color: #0284c7;">Account</span></h1>
                <p style="font-size: 0.85rem; color: #64748b; margin-top: 4px;">Join the Integrated Software Testing Platform</p>
            </div>

            <!-- Flash alerts -->
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }}">
                            <span>{{ message }}</span>
                            <button onclick="this.parentElement.remove()" style="background:none; border:none; cursor:pointer; font-weight:bold; color:inherit;">&times;</button>
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <!-- Register Form -->
            <form action="{{ url_for('register') }}" method="POST">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px;">
                    <div class="form-group">
                        <label class="form-label" for="username">Username *</label>
                        <input type="text" id="username" name="username" class="form-control" placeholder="john_doe" required autofocus>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="full_name">Full Name</label>
                        <input type="text" id="full_name" name="full_name" class="form-control" placeholder="John Doe">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="email">Email Address *</label>
                    <input type="email" id="email" name="email" class="form-control" placeholder="john@example.com" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="role">User Role</label>
                    <select id="role" name="role" class="form-control">
                        <option value="Tester" selected>Software Tester / QA Engineer</option>
                        <option value="Developer">Software Developer</option>
                        <option value="Student">Student / Academic</option>
                        <option value="Administrator">Administrator</option>
                    </select>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px;">
                    <div class="form-group">
                        <label class="form-label" for="password">Password *</label>
                        <input type="password" id="password" name="password" class="form-control" placeholder="Min. 6 chars" required minlength="6">
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="confirm_password">Confirm Password *</label>
                        <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="Re-type password" required minlength="6">
                    </div>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 12px; font-size: 0.95rem; margin-top: 10px;">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="8.5" cy="7" r="4"></circle><line x1="20" y1="8" x2="20" y2="14"></line><line x1="23" y1="11" x2="17" y2="11"></line></svg>
                    Register and Continue
                </button>
            </form>

            <div style="text-align: center; margin-top: 22px; font-size: 0.85rem; color: #64748b;">
                Already have an account? 
                <a href="{{ url_for('login') }}" style="color: #0284c7; text-decoration: none; font-weight: 600;">Sign In</a>
            </div>
        </div>
    </div>
</body>
</html>
